# Signal Lab is three crates: the engine, and the two ways to run it — the
# desktop app (src-tauri) and the headless server (server). Only the desktop
# app depends on Tauri and a webview; the server and the engine build anywhere.
[workspace]
members = ["engine", "server", "src-tauri"]
resolver = "2"

[workspace.package]
# Written by scripts/version.mjs from package.json — the one version.
version = "0.3.1"
edition = "2021"
license = "MIT"
authors = ["ProAnimaStudio"]
repository = "https://github.com/ProAnima/SignalLab"

[workspace.dependencies]
signal-lab-engine = { path = "engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tracing = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
