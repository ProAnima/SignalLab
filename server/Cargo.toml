[package]
name = "signal-lab-server"
description = "Signal Lab without a window: the engine and its interface over HTTP and WebSocket, for a browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "signal-lab-server"
path = "src/main.rs"

[dependencies]
signal-lab-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
# Connections served by hand (lib.rs), as axum does but with a deadline for a
# request's head and a bound on how long stopping waits: the crates axum already brings in.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false }
# The body of a followed run (/api/run), written as the run goes.
futures-util = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
