# Every check of `npm run check` (scripts/check.mjs), on Windows and on Linux;
# the end-to-end tour of every screen (scripts/e2e.mjs) in the desktop app and
# in the server, on both; and the server image built, smoke-tested and toured
# for x64 and arm64 (`npm run check:image`), for every push to main and every
# pull request. The release workflow runs this first, on the tag it is about to
# build. See docs/delivery.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to check
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  # A newer push to a pull request supersedes the older run; main keeps every run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # 22.04, not latest: packages built against its glibc run on older distributions too.
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      # The toolchain pinned in rust-toolchain.toml, with its components.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: npm ci --no-audit --no-fund

      - name: npm run check
        run: node scripts/check.mjs

      # The Linux desktop app's webview: tooltips driven with real pointer and key events.
      - name: Tooltips in WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver xvfb
          xvfb-run -a node scripts/webkit.mjs --native

      # Every screen in the real app, against loopback fixtures: the desktop app
      # (WebView2 / WebKitGTK) and the server in a browser (Edge / WebKitGTK).
      # The desktop tour needs the WebView2 runtime: Windows 11 ships it, a
      # server image may not. The version goes in the log either way.
      - name: WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $version) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2-setup.exe"
            Start-Process "$env:RUNNER_TEMP\webview2-setup.exe" -ArgumentList '/silent', '/install' -Wait
            $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          }
          if (-not $version) { throw 'no WebView2 runtime' }
          "WebView2 runtime $version"

      - name: End-to-end tour (Windows)
        if: runner.os == 'Windows'
        run: node scripts/e2e.mjs

      - name: End-to-end tour (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/e2e.mjs --native

      # A screenshot of every step and what each check said, when something broke.
      - name: Keep the tour's screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.name }}
          path: artifacts/e2e/
          retention-days: 7

  # The image the image workflow publishes when a release is published, built
  # the same way and run through the same smoke test, so a release never finds
  # out at publication that it does not build.
  image:
    name: Server image (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            os: ubuntu-24.04
            platform: linux/amd64
          - name: arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          # The checked-out files, not the event's commit: a release checks its tag.
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: signallab:ci
          # Attestations are for the pushed image; a loaded one cannot carry them.
          provenance: false
          cache-from: type=gha,scope=image-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.name }}

      - name: Smoke test
        run: node scripts/image.mjs smoke signallab:ci

      # deploy/install.sh for real, on this runner's Docker: install, update, remove.
      - name: Install script
        run: node scripts/install-test.mjs --image signallab:ci

      # The action in action.yml, with the image just built: a run that passes
      # leaves its JUnit report; one that fails fails with exit code 1.
      - name: GitHub Action, a passing run
        id: action-pass
        uses: ./
        with:
          experiments: empty
          image: signallab
          version: ci
          junit: action/junit.xml
      - name: GitHub Action, a failing run
        id: action-fail
        continue-on-error: true
        uses: ./
        with:
          # Nothing listens on the port the template asks: the request is refused.
          experiments: http-check
          image: signallab
          version: ci
          junit: action/failed.xml
      - name: GitHub Action, what the two runs left
        run: |
          grep -q 'tests="2" failures="0"' action/junit.xml
          test "${{ steps.action-pass.outputs.exit-code }}" = 0
          test "${{ steps.action-fail.outputs.exit-code }}" = 1
          grep -q 'type="transport.refused"' action/failed.xml

      # The interface the image serves, every screen, in WebKitGTK; the
      # container shares the host's loopback with the tour's fixtures.
      - name: End-to-end tour of the image
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver xvfb
          npm ci --no-audit --no-fund
          docker run -d --name signallab-tour --network host -e SIGNALLAB_LISTEN=127.0.0.1:1430 signallab:ci
          xvfb-run -a node scripts/e2e.mjs --native --target server --server-url http://127.0.0.1:1430/ --data-dir /data
          if docker logs signallab-tour 2>&1 | grep -q panicked; then docker logs signallab-tour; echo "::error::the server panicked"; exit 1; fi

      - name: Keep the tour's screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-image-${{ matrix.name }}
          path: artifacts/e2e/
          retention-days: 7
