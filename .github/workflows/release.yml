# A version tag — pushed by `npm run release -- X.Y.Z --push` — becomes a draft
# GitHub release with the Windows and Linux installers and SHA256SUMS.txt.
# Publishing the draft is a person's decision: review it on the releases page.
# See docs/delivery.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build again into its draft, e.g. v0.4.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  draft:
    name: Draft release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The tag matches the version
        run: node scripts/version.mjs check --tag "$TAG"
      - name: Draft with notes from CHANGELOG.md
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-release.mjs draft "$TAG"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      # The toolchain pinned in src-tauri/rust-toolchain.toml, with its components.
      - name: Rust toolchain
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      - run: npm ci --no-audit --no-fund

      - name: Build and upload to the draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          args: --bundles ${{ matrix.bundles }}
          includeUpdaterJson: false

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: SHA256SUMS.txt for every installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-release.mjs checksums "$TAG"
