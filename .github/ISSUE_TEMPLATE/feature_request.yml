name: Idea
description: Something Signal Lab could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The task or the equipment, and where Signal Lab gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working — a screen, a node of an experiment, a command, an option.
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: Protocols, devices, standards or other tools that matter here.
