[package]
name = "signal-lab-cli"
description = "Signal Lab on the command line: experiments run headless for scripts and CI, on this machine or on a lab server, and one-shot sends"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "signallab"
path = "src/main.rs"

[dependencies]
signal-lab-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
# io-std: `signallab mcp` speaks on stdin and stdout.
tokio = { workspace = true, features = ["io-std"] }
clap = { version = "4", features = ["derive", "env"] }
# Runs on a server (--server): POST /api/run, read as lines; reports from /api/files.
reqwest = { version = "0.12", features = ["json"] }
rand = "0.8"

[build-dependencies]
# The interface's dictionaries are read at build time (src/lib/locales/*.ts).
serde_json.workspace = true

[dev-dependencies]
# `signallab run --server` is tested against a real server started in the test.
signal-lab-server = { path = "../server" }
