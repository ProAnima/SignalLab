[package]
name = "signal-lab-engine"
description = "Signal Lab's engine: protocol simulators, capture and the experiment runner, without a window"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest = { version = "0.12", features = ["json", "gzip"] }
rand = "0.8"
# Extract by pattern and the "matches" comparison in experiments.
regex = "1"
# Socket options tokio doesn't expose before bind — SO_REUSEADDR, so the
# discovery listener can share a port with the real service.
socket2 = "0.5"
# The HTTP emulator's server: HTTP/1.1 on hyper, already in the tree through reqwest.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

# Experiment secrets live in the operating system's credential store, never in
# a file. Only stores that persist are enabled; other platforms report that
# secrets are unavailable instead of keeping them in memory (a server reads
# them read-only, see secrets::FileStore).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
