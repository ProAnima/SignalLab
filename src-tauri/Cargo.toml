[package]
name = "signal-lab"
description = "Signal Lab — OSC & network protocol simulator (a ProAnimaStudio product)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the lib name unique so it doesn't clash with the bin
# name on Windows (see rust-lang/cargo#8519).
name = "signal_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
signal-lab-engine.workspace = true
serde_json.workspace = true
tracing.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
